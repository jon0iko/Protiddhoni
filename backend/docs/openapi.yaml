# OpenAPI 3.0 description of the Protiddhoni REST API.
#
# Served by swagger-ui-express at /api-docs (see app.ts). Kept as a single
# static document rather than per-route JSDoc annotations so that the whole
# API surface is readable in one place and reviewable in one diff.
openapi: 3.0.3
info:
  title: Protiddhoni API
  version: '1.0.0'
  description: |
    REST API for Protiddhoni, a Bengali digital storytelling platform.

    **Authentication** — send `Authorization: Bearer <JWT>`. Obtain a token from
    `POST /api/auth/login` or `POST /api/auth/register`.

    **Response envelope** — every response has the shape
    `{ success: boolean, data?: ..., message?: string, error?: string }`.

    **Rate limits** — 1000 requests / 15 min per IP across `/api`; 30 failed
    attempts / 15 min on the login and register endpoints.
  license:
    name: Coursework — CSE 4113, University of Dhaka
servers:
  - url: https://protiddhoni.farefin.com
    description: Production
  - url: http://localhost:5000
    description: Local development
tags:
  - name: Authentication
  - name: Content
  - name: Series
  - name: Users & Social
  - name: Reviews (legacy)
  - name: Comments
  - name: Ratings
  - name: Categories
  - name: Bookmarks
  - name: Likes
  - name: Reading Preferences
  - name: Drafts
  - name: Notifications
  - name: Payments & Wallet
  - name: Purchases
  - name: Web Push
  - name: Quizzes
  - name: Content Reports
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Success:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { description: Endpoint-specific payload }
        message: { type: string }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string, example: Not authorised }
  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but not permitted (wrong role, or premium content not purchased)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Rate limit exceeded
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
paths:
  /health:
    get:
      tags: [Operations]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is up
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in with email or username
      security: []
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '201':
          description: Success
          content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } }
  /api/auth/logout:
